<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StintLogic.com | F1 Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          transparent: 'transparent',
          current: 'currentColor',
          extend: {
            colors: {
              f1: {
                red: '#FF1E00',
                dark: '#0B0B0F',
                surface: '#121218',
                border: '#2A2A35',
                text: '#E0E0E0',
                muted: '#858595'
              },
              // Tremor Dark Mode Colors
              tremor: {
                background: {
                  DEFAULT: '#121218', // F1 Surface
                  subtle: '#1a1a22',  // Darker
                  emphasis: '#2A2A35', // Border color
                },
                border: {
                  DEFAULT: '#2A2A35',
                },
                ring: {
                  DEFAULT: '#1f2937',
                },
                content: {
                  subtle: '#858595', // Muted
                  DEFAULT: '#9ca3af', // Gray-400
                  emphasis: '#E0E0E0', // F1 Text
                  strong: '#ffffff',
                  inverted: '#000000',
                },
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            backgroundImage: {
              'dot-grid': 'radial-gradient(#2A2A35 1px, transparent 1px)',
            },
            boxShadow: {
              // Tremor shadows
              'tremor-input': '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              'tremor-card': '0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)',
              'tremor-dropdown': '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)',
            },
            borderRadius: {
              'tremor-small': '0.375rem',
              'tremor-default': '0.5rem',
              'tremor-full': '9999px',
            },
            fontSize: {
              'tremor-label': ['0.75rem', { lineHeight: '1rem' }],
              'tremor-default': ['0.875rem', { lineHeight: '1.25rem' }],
              'tremor-title': ['1.125rem', { lineHeight: '1.75rem' }],
              'tremor-metric': ['1.875rem', { lineHeight: '2.25rem' }],
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B0B0F;
        color: #E0E0E0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      
      * {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2A35; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF1E00; 
      }
      
      .glass-panel {
        background: rgba(18, 18, 24, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* ApexCharts Dark Mode Customizations */
      .apexcharts-tooltip {
        background: rgba(18, 18, 24, 0.9) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
        color: #fff;
      }
      .apexcharts-tooltip-title {
        background: rgba(255, 255, 255, 0.05) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        font-family: 'JetBrains Mono', monospace !important;
      }
      .apexcharts-text {
        fill: #858595 !important;
        font-family: 'JetBrains Mono', monospace !important;
      }
      .apexcharts-gridline {
        stroke: #2A2A35 !important;
      }
      .apexcharts-menu {
        background: #121218 !important;
        border: 1px solid #2A2A35 !important;
        color: #fff !important;
      }
      .apexcharts-menu-item:hover {
        background: #2A2A35 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@tremor/react": "https://esm.sh/@tremor/react@3.14.1?deps=react@19.2.3,react-dom@19.2.3",
    "clsx": "https://esm.sh/clsx@2.1.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1",
    "framer-motion": "https://esm.sh/framer-motion@11.18.2",
    "apexcharts": "https://esm.sh/apexcharts@3.49.1",
    "react-apexcharts": "https://esm.sh/react-apexcharts@1.4.1?deps=react@19.2.3,apexcharts@3.49.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
